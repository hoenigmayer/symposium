<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Venue - Bewtween the World Symposium</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --ink:#111; --hairline:1px solid #111; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',sans-serif; font-weight:300; color:var(--ink); background:#fff; }
  .page { max-width:680px; margin:0 auto; padding:4rem 2rem; }
  .num  { font-size:.65rem; letter-spacing:.4em; text-transform:uppercase; color:#777; margin-bottom:.75rem; }
  h2 { font-family:'Cormorant Garamond',serif; font-weight:400; font-size:2.4rem; margin-bottom:1.5rem; }
  p   { line-height:1.85; margin-bottom:1.25rem; font-size:.95rem; }
  .rule { border:none; border-top:var(--hairline); width:64px; margin:2.5rem 0; }
  .map { width:100%; height:320px; border:var(--hairline); filter:grayscale(1); }
</style>
</head>
<body>
  <div class="page">
    <div class="num">04 - Venue</div>
    <h2>TU Wien, Vienna</h2>
    <hr class="rule">
    <p><strong>TU Wien</strong><br>
    Gußhausstraße  27-29,  1040  Vienna, Austria</p>
    <p>Located at the Technical University Gusshausstrassen Building, the venue offers all amenities for a productive meeting. Easily accessible from U1/u2/U4 Karlsplatz station.</p>

    <iframe class="map"
      src="https://www.openstreetmap.org/export/embed.html?bbox=16.3626%2C48.1926%2C16.3766%2C48.1996&amp;layer=mapnik&amp;marker=48.1960361%2C16.3695954"
      title="Map of the venue"></iframe>
  </div>
</body>
</html>
